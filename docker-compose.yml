version: '3.8'

# ── Container log rotation ───────────────────────────────────────────────────
# ⚠ Docker's default json-file driver has NO rotation, so every container log
# grows without bound. Measured on prod 2026-08-14: `databook-nginx` alone was
# **2.0 GB** (container up ~2 months, ~33 MB/day of access log), against 2.0 GB
# for all containers combined — i.e. essentially all of it.
#
# ⚠ The reason it had never caused an incident is luck, not policy: a container's
# json log is truncated only when the container is RECREATED, never by
# `docker compose restart`. So the counter resets on deploys that rebuild an
# image and keeps climbing on every deploy that does not.
#
# Declared here rather than in /etc/docker/daemon.json deliberately. A daemon
# default would cover every container on the box (including the map1 and nycdb
# projects), but it lives only on the box, needs a dockerd restart, and this
# repo has been bitten before by ops scripts editing the box's compose without
# committing the result. A version-controlled block is reviewable, travels with
# the repo, and takes effect on the next `up -d`. The box-wide daemon default is
# a complementary decision, not a substitute — see task 86b6bd77.
#
# ⚠ These take effect only when a container is RECREATED. `up -d` does that
# automatically because the logging config is part of the container spec, and
# that recreate is also what reclaims the existing 2.0 GB.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"          # => 150 MB ceiling per container

# nginx is deliberately given more headroom than the default: it is the highest
# volume log on the box AND the one this repo actually reads for traffic
# analysis (the crawler/ASN measurements in CLAUDE.md come from its access log).
# At ~33 MB/day the default would retain barely four days. 100m x 5 keeps ~15
# days while still bounding the file that caused this.
x-logging-nginx: &nginx-logging
  driver: json-file
  options:
    max-size: "100m"
    max-file: "5"          # => 500 MB ceiling

services:
  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    image: databook-laravel
    container_name: databook-app
    logging: *default-logging
    restart: unless-stopped
    working_dir: /var/www

    networks:
      - databook-network
    depends_on:
      - mysql
      - redis
    environment:
      DB_HOST: mysql
      REDIS_HOST: redis
      FAPI_ENTRY: http://api:8000
    volumes:
      - shared_data:/var/shared
      - ./app/.env:/var/www/.env

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    image: databook-api
    container_name: databook-api
    logging: *default-logging
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${API_POSTGRES_USER:?set API_POSTGRES_USER in .env}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_api_password
      POSTGRES_DB: ${POSTGRES_DB:-databook}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      # Route via nginx reverse proxy (normalizer.conf) — API container
      # cannot reach Cloudflare-proxied normalize.databook.nyc directly.
      NORMALIZER_BASE_URL: ${NORMALIZER_BASE_URL:-http://databook-nginx/normalizer}
      DATA_SCHEDULER_ENABLED: "1"
      # Dead-man's switch for the scheduler loop (data_scheduler._hc_ping).
      # ⚠ The api has no env_file, so a value in .env is only available for
      # INTERPOLATION — it must be named here or the container never sees it.
      # ⚠ `:-` and not `:?`: an unset value must leave the ping a NO-OP, never
      # fail the container closed. Monitoring that can stop the service it
      # monitors is worse than no monitoring.
      HC_URL_API_SCHEDULER: ${HC_URL_API_SCHEDULER:-}
      # Spending/budget/revenue data lake. Default = AWS S3 (public-read, over
      # HTTPS). Set these (+ DATA_LAKE_PATH below) in the env/.env to serve the
      # Parquet off the mounted local /data volume instead — no AWS creds needed.
      SPENDING_DATA_BASE: ${SPENDING_DATA_BASE:-https://nyc-databook-spending.s3.amazonaws.com}
      BUDGET_REVENUE_BASE: ${BUDGET_REVENUE_BASE:-https://nyc-databook-spending.s3.amazonaws.com}
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          # 1 GiB was too tight for the DuckDB-over-Parquet spending/budget/revenue
          # workload — a single heavy scan (or a burst of them) spiked past 1 GiB and
          # the container was OOM-killed and restarted. Headroom on the host is ample
          # (~11 GiB free). Defense-in-depth alongside the bounded digital-reform cache.
          memory: 3072M
          cpus: '1.0'
    volumes:
      - tmp-data:/var/tmp
      - shared_data:/app/shared
      - ./api/env.yaml:/app/env.yaml
      - ./titles_analysis.csv:/app/titles_analysis.csv
      # Local data lake (spending/budget/revenue Parquet). Empty by default; on
      # prod DATA_LAKE_PATH points at the populated host dir. Only read when
      # SPENDING_DATA_BASE/BUDGET_REVENUE_BASE point at /data.
      - ${DATA_LAKE_PATH:-./data-lake}:/data
    networks:
      - databook-network
    depends_on:
      postgres:
        condition: service_healthy
    dns:
      - 127.0.0.11
      - 8.8.8.8
      - 1.1.1.1
    secrets:
      - postgres_api_password

  mcp:
    build:
      context: ./api
      dockerfile: Dockerfile.mcp
    image: databook-mcp
    container_name: databook-mcp
    logging: *default-logging
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${MCP_POSTGRES_USER:?set MCP_POSTGRES_USER in .env}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_mcp_password
      POSTGRES_DB: ${POSTGRES_DB:-databook}
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8082/admin/logs" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    networks:
      - databook-network
    depends_on:
      postgres:
        condition: service_healthy

  # Newsletter service moved to AWS App Runner (Feb 2026)
  # URL: https://sgkenm8rum.us-east-1.awsapprunner.com
    secrets:
      - postgres_mcp_password

  # ⚠ NEWSLETTER RETIRED 2026-08-05. Stopped and commented out rather than
  # deleted, because the owner may revisit it. It was serving UNAUTHENTICATED on
  # api.databook.nyc/newsletter with live AWS + Gemini keys in its environment and
  # POST /send reachable. Revive only behind auth, and rotate those keys first —
  # they are committed in the databook-newsletter Dockerfile (task de2b9155).
#  newsletter:
#    build:
#      context: ./databook_newsletter/repo
#      dockerfile: Dockerfile
#    image: databook-newsletter
#    container_name: databook-newsletter
#    restart: unless-stopped
#    env_file:
#      - ./databook_newsletter/repo/.env
#    environment:
#      MCP_ENDPOINT: http://mcp:8082/mcp
#      BASE_PATH: /newsletter
#      TZ: America/New_York
#    volumes:
#      - ./databook_newsletter/repo/output:/app/output
#    depends_on:
#      mcp:
#        condition: service_healthy
#    networks:
#      - databook-network
  nginx:
    image: nginx:alpine
    container_name: databook-nginx
    logging: *nginx-logging
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./app:/var/www
      - ./nginx/conf.d:/etc/nginx/conf.d
      - /etc/letsencrypt:/etc/letsencrypt
    networks:
      - databook-network
    depends_on:
      - app
      - api
    extra_hosts:
      - "host.docker.internal:host-gateway"

  mysql:
    image: mysql:8.0
    container_name: databook-mysql
    logging: *default-logging
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-laravel}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_USER: ${DB_USERNAME:-laravel}
      MYSQL_ALLOW_EMPTY_PASSWORD: 1
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - databook-network

  postgres:
    image: postgres:10-alpine
    container_name: databook-postgres
    logging: *default-logging
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-databook}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_superuser_password
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 15s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - tmp-data:/var/tmp
    networks:
      - databook-network
    secrets:
      - postgres_superuser_password

  redis:
    image: redis:alpine
    container_name: databook-redis
    logging: *default-logging
    restart: unless-stopped
    volumes:
      - redis-data:/data
    networks:
      - databook-network

networks:
  databook-network:
    driver: bridge

volumes:
  mysql-data:
  postgres-data:
  redis-data:
  tmp-data:
  shared_data:

# Credentials as files rather than environment variables: the value lands at
# /run/secrets/<name> instead of appearing in `docker inspect`, in
# `docker compose config` output, and in /proc/<pid>/environ for every process
# in the container. Created (0600) by the rotation and role-split scripts;
# secrets/ is gitignored.
secrets:
  postgres_superuser_password:
    file: ./secrets/postgres_superuser_password
  postgres_api_password:
    file: ./secrets/postgres_api_password
  postgres_mcp_password:
    file: ./secrets/postgres_mcp_password
