# map.databook.nyc — HTTP (redirect to HTTPS)
server {
    listen 80;
    server_name map.databook.nyc;

    location /.well-known/acme-challenge/ {
        root /etc/letsencrypt/webroot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# map.databook.nyc — HTTPS
server {
    location /.well-known/acme-challenge/ {
        root /etc/letsencrypt/webroot;
    }
    listen 443 ssl;
    server_name map.databook.nyc;

    ssl_certificate /etc/letsencrypt/cloudflare/origin.pem;
    ssl_certificate_key /etc/letsencrypt/cloudflare/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    resolver 127.0.0.11 valid=30s;

    location /iso-tiles/ {
        rewrite ^/iso-tiles/(.*) /dzi/$1 break;
        proxy_pass https://isometric-nyc-tiles.cannoneyed.com;
        proxy_ssl_server_name on;
        proxy_set_header Host isometric-nyc-tiles.cannoneyed.com;
        proxy_set_header Origin "https://cannoneyed.com";
    }

    location /tiles/ {
        rewrite ^/tiles/(.*) /$1 break;
        proxy_pass http://host.docker.internal:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Astro API proxy routes (before generic /api/)
    location /api/databook/ {
        proxy_pass http://host.docker.internal:4321;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/nycdb/ {
        proxy_pass http://host.docker.internal:4321;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
location /api/opendata {        proxy_pass http://host.docker.internal:4321;        proxy_set_header Host $host;        proxy_set_header X-Real-IP $remote_addr;        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;        proxy_set_header X-Forwarded-Proto $scheme;    }
    location /api/ff/ {
        proxy_pass http://host.docker.internal:4321;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://host.docker.internal:3002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Range" always;
        if ($request_method = OPTIONS) { return 204; }
    }

    location / {
        proxy_pass http://host.docker.internal:4321;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
