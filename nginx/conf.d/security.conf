# =============================================================================
# Cloudflare real IP restoration
# Without this, all requests appear from Cloudflare IPs, breaking rate limiting.
# =============================================================================
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
real_ip_header CF-Connecting-IP;

# =============================================================================
# Bot blocking and rate limiting
# =============================================================================

# Rate limit zones (must be at http level, loaded via conf.d/*.conf)
limit_req_zone $binary_remote_addr zone=pages:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

# Map to identify blocked bots by User-Agent
map $http_user_agent $is_blocked_bot {
    default 0;
    ~*Bytespider        1;
    ~*GPTBot            1;
    ~*CCBot             1;
    ~*ClaudeBot         1;
    ~*Amazonbot         1;
    ~*Amzn-SearchBot    1;
    ~*SemrushBot        1;
    ~*AhrefsBot         1;
    ~*MJ12bot           1;
    ~*DotBot            1;
    ~*BLEXBot           1;
    ~*PetalBot          1;
    ~*YandexBot         1;
    ~*Sogou             1;
    ~*Baiduspider       1;
    ~*DataForSeoBot     1;
    ~*Applebot          1;
    ~*SeekportBot       1;
    ~*ZoominfoBot       1;
    ~*Linguee           1;
    ~*bingbot           1;
}
