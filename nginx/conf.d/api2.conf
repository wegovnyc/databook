server {
    location /.well-known/acme-challenge/ {
        root /etc/letsencrypt/webroot;
    }
    listen 443 ssl;
    server_name api2.databook.nyc;
    ssl_certificate /etc/letsencrypt/cloudflare/origin.pem;
    ssl_certificate_key /etc/letsencrypt/cloudflare/origin.key;
    # Re-resolve the nycdb-api container IP at runtime via Docker's embedded DNS.
    # A `docker compose up -d --build` in /opt/nycdb recreates nycdb-api with a new
    # IP; with a literal proxy_pass host, nginx caches the old IP at config load and
    # 502s until a manual reload. Variable proxy_pass + resolver re-resolves per
    # request (TTL 10s), so nycdb rebuilds are zero-touch. (Requires nycdb-api on
    # the shared databook network — see /opt/nycdb/docker-compose.yml.)
    resolver 127.0.0.11 valid=10s ipv6=off;
    location / {
        set $nycdb_upstream nycdb-api;
        proxy_pass http://$nycdb_upstream:8000;
        proxy_set_header Host $host;
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type" always;
        if ($request_method = OPTIONS) { return 204; }
    }
}
server { listen 80; server_name api2.databook.nyc; return 301 https://$host$request_uri; }
