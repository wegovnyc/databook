# Reverse proxy for normalizer — allows the API container
# to reach the external normalizer service via the nginx container.
# The API container's Docker network cannot reach normalize.databook.nyc
# directly (Cloudflare), but the nginx container can.
server {
    location /.well-known/acme-challenge/ {
        root /etc/letsencrypt/webroot;
    }
    listen 80;
    server_name databook-nginx;

    location /normalizer/ {
        proxy_pass http://normalizer:8090/;
        proxy_set_header Host normalize.databook.nyc;
        proxy_read_timeout 1800s;
        proxy_connect_timeout 30s;
    }
}
