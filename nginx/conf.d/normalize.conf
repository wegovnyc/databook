server {
    listen 80;
    server_name normalize.databook.nyc;
    location /.well-known/acme-challenge/ { root /etc/letsencrypt/webroot; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name normalize.databook.nyc;
    ssl_certificate /etc/letsencrypt/cloudflare/origin.pem;
    ssl_certificate_key /etc/letsencrypt/cloudflare/origin.key;
    client_max_body_size 500m;
    location / {
        proxy_pass http://normalizer:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
