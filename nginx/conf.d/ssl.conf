# HTTPS redirect and SSL for databook.nyc
server {
    location /.well-known/acme-challenge/ {
        root /etc/letsencrypt/webroot;
    }
    listen 443 ssl;
    server_name databook.nyc www.databook.nyc;
    
    ssl_certificate /etc/letsencrypt/cloudflare/origin.pem;
    ssl_certificate_key /etc/letsencrypt/cloudflare/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    
    resolver 127.0.0.11 valid=30s;
    
    root /var/www/public;
    index index.php index.html;

    # Block aggressive bots
    if ($is_blocked_bot) {
        return 403;
    }
    
    # Rate-limit + IP-block research pages (Baidu uses fake Chrome UAs)
    location /research/ {
        deny 220.181.0.0/16;
        deny 116.179.0.0/16;
        deny 119.249.0.0/16;
        deny 180.76.0.0/16;
        deny 47.79.0.0/16;   # Alibaba Cloud scraper farm (fuzzing digital-reform, 2026-07-12)
        deny 47.82.0.0/16;   # Alibaba Cloud scraper farm (fuzzing digital-reform, 2026-07-12)
        allow all;
        limit_req zone=pages burst=3 nodelay;
        limit_req_status 429;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location / {
        # Rate limit page requests (5 req/s per IP, burst of 10)
        limit_req zone=pages burst=10 nodelay;
        limit_req_status 429;
        try_files $uri $uri/ /index.php?$query_string;
    }
    
    # Serve static assets without rate limiting
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot|map)$ {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }
    
    location ~ \.php$ {
        limit_req zone=pages burst=10 nodelay;
        limit_req_status 429;
        set $upstream app:9000;
        fastcgi_pass $upstream;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 120s;
    }
}

# HTTPS for api.databook.nyc
server {
    location /.well-known/acme-challenge/ {
        root /etc/letsencrypt/webroot;
    }
    listen 443 ssl;
    server_name api.databook.nyc;
    
    ssl_certificate /etc/letsencrypt/cloudflare/origin.pem;
    ssl_certificate_key /etc/letsencrypt/cloudflare/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    
    resolver 127.0.0.11 valid=30s;

    # Block aggressive bots from API too
    if ($is_blocked_bot) {
        return 403;
    }
    
    location /mcp {
        set $mcp_up http://mcp:8082;
        proxy_pass $mcp_up;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
    }
    
    # Newsletter endpoint
    location /newsletter {
        set $newsletter_up http://newsletter:8080;
        rewrite ^/newsletter/?(.*)$ /$1 break;
        proxy_pass $newsletter_up;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
    
    location / {
        # Rate limit API requests (10 req/s per IP, burst of 20)
        limit_req zone=api burst=20 nodelay;
        limit_req_status 429;
        set $api_up http://api:8000;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffer_size 128k;
        proxy_buffers 8 256k;
        proxy_pass $api_up;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
