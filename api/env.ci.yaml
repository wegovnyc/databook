# Non-secret test config for the CI integration-smoke job ONLY.
# Real api/env.yaml is gitignored (holds real creds). CI copies this to
# api/env.yaml so the api can boot against the ephemeral compose Postgres.
# db creds match the compose postgres defaults (postgres / secret / databook).
db:
  user: postgres
  pwd: "secret"
  dbname: databook
  host: postgres
  addr: pq://postgres:secret@postgres:5432/databook
fastapi:
  key: ci-test-key-not-a-secret
masterpass: ci-test-masterpass-not-a-secret
